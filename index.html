<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Our floor plans</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap");

:root {
  --white: #ffffff;
  --lightning-50: #f5f7ff; --lightning-100: #ebf0ff; --lightning-200: #ccd9ff;
  --lightning-300: #99b3ff; --lightning-400: #668cff; --lightning-500: #3366ff;
  --lightning-600: #264dc3; --lightning-700: #193586; --lightning-800: #0d1c4a; --lightning-900: #001238;
  --mint-100: #ebf9f6; --mint-200: #ccefe7; --mint-500: #32c0a0; --mint-800: #0c3332;
  --dusk-100: #feeeef; --dusk-200: #fcd5d7; --dusk-500: #f3565d; --dusk-600: #b64149; --dusk-800: #3d1617;
  --solar-100: #fff9ea; --solar-200: #feefcb; --solar-400: #fcd062; --solar-500: #fbc02d; --solar-800: #3f3316;
  --fog-50: #f8f9fa; --fog-100: #f1f3f4; --fog-200: #e4e6ea; --fog-300: #dde0e4;
  --fog-400: #bbc1ca; --fog-500: #99a1af; --fog-600: #778295; --fog-700: #596273; --fog-800: #3b4351;

  --bg: var(--fog-100);
  --bg-surface: var(--white);
  --bg-surface-muted: var(--fog-200);
  --text: var(--lightning-900);
  --text-muted: var(--fog-600);
  --text-on-brand: var(--white);
  --text-alert: var(--dusk-500);
  --border: var(--fog-200);
  --border-strong: var(--fog-300);
  --border-brand: var(--lightning-500);
  --border-alert: var(--dusk-500);
  --color-primary: var(--lightning-500);
  --color-primary-hover: var(--lightning-600);
  --color-primary-active: var(--lightning-700);

  --shadow-button-focus: 0 0 0 4px rgba(51, 102, 255, 0.6);
  --shadow-input-focus: 0 0 8px 0 rgba(51, 102, 255, 0.5);
  --shadow-card: 0 4px 64px 0 rgba(119, 130, 149, 0.10);

  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 16px; --radius-pill: 100px;
  --font-brand: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; font-family: var(--font-brand); font-size: 14px; line-height: 20px;
  color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
button { font-family: inherit; }
a { color: var(--color-primary); text-decoration: none; }
a:hover { text-decoration: underline; }
.page-title { font-weight: 600; font-size: 28px; line-height: 36px; letter-spacing: -0.01em; }
.h2 { font-weight: 600; font-size: 18px; line-height: 24px; }
.card-title { font-weight: 600; font-size: 16px; line-height: 22px; }
.label { font-weight: 600; font-size: 14px; }
.sm { font-size: 12px; line-height: 18px; }
.xs { font-size: 11px; line-height: 14px; color: var(--text-muted); }
.muted { color: var(--text-muted); }

/* icons */
.icon { display: inline-flex; width: 20px; height: 20px; flex: none; }
.icon svg { width: 100%; height: 100%; display: block; }
.icon-sm { width: 16px; height: 16px; }
.icon-xs { width: 14px; height: 14px; }
.icon-lg { width: 32px; height: 32px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 600; font-size: 14px; line-height: 20px; padding: 9px 20px;
  border-radius: var(--radius-pill); border: 1px solid transparent; cursor: pointer;
  background: transparent; transition: background-color .15s ease, color .15s ease, border-color .15s ease;
  white-space: nowrap;
}
.btn:focus-visible { box-shadow: var(--shadow-button-focus); outline: none; }
.btn-primary { background: var(--color-primary); color: var(--text-on-brand); }
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-primary:active { background: var(--color-primary-active); }
.btn-primary:disabled { background: var(--lightning-300); pointer-events: none; }
.btn-secondary { background: transparent; color: var(--color-primary); border-color: var(--border); }
.btn-secondary:hover { background: var(--lightning-100); }
.btn-ghost { background: transparent; color: var(--text-muted); }
.btn-ghost:hover { background: var(--fog-100); color: var(--text); }
.btn-danger { background: transparent; color: var(--text-alert); }
.btn-danger:hover { background: var(--dusk-100); }
.btn-icon { padding: 8px; border-radius: var(--radius-pill); }
.btn-block { width: 100%; }

/* fields */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field input, .field textarea, .field select {
  font-family: var(--font-brand); font-size: 14px; line-height: 20px; color: var(--text);
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 10px 12px; outline: none; transition: box-shadow .15s ease, border-color .15s ease; width: 100%;
}
.field textarea { resize: vertical; min-height: 72px; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--border-brand); box-shadow: var(--shadow-input-focus); }
.field .error-text { color: var(--text-alert); font-size: 12px; }
.field .hint { color: var(--text-muted); font-size: 12px; }
.field.has-error input, .field.has-error textarea { border-color: var(--border-alert); }
.inline-add { display: flex; gap: 8px; }
.inline-add input { flex: 1; }

/* card */
.card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 24px; }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; line-height: 18px; white-space: nowrap; }
.badge-mint { background: var(--mint-100); color: var(--mint-800); }
.badge-solar { background: var(--solar-200); color: var(--solar-800); }
.badge-fog { background: var(--fog-200); color: var(--fog-800); }
.badge-lightning { background: var(--lightning-100); color: var(--lightning-900); }

/* avatar */
.avatar { width: 22px; height: 22px; border-radius: 100px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; flex: none; }

/* stars */
.stars { display: inline-flex; gap: 2px; align-items: center; }
.stars .icon { color: var(--fog-300); }
.stars .icon.filled { color: var(--solar-500); }
.stars.interactive button { background: none; border: none; padding: 0; cursor: pointer; color: var(--fog-300); line-height: 0; }
.stars.interactive button.filled { color: var(--solar-500); }
.stars.interactive button:hover { color: var(--solar-400); }

/* navbar */
.navbar { position: sticky; top: 0; z-index: 100; height: 56px; background: var(--bg-surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
.navbar-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; color: var(--text); }
.navbar-brand .icon { color: var(--color-primary); }
.navbar-user { display: flex; align-items: center; gap: 10px; }

/* layout */
.page { max-width: 1080px; margin: 0 auto; padding: 32px 24px 80px; }
.page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.page-header-actions { display: flex; align-items: center; gap: 12px; }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 600; font-size: 13px; margin-bottom: 16px; }
.back-link:hover { color: var(--text); text-decoration: none; }

.fp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.fp-card { display: block; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 20px; color: var(--text); transition: border-color .15s ease; }
.fp-card:hover { border-color: var(--border-brand); text-decoration: none; }
.fp-card-source { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 12px; margin-top: 2px; margin-bottom: 14px; }
.fp-card-ratings { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.fp-card-rating-row { display: flex; align-items: center; gap: 8px; }
.fp-card-rating-row .name { font-size: 12px; color: var(--text-muted); width: 64px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fp-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); }

.empty-state { grid-column: 1 / -1; text-align: center; padding: 64px 24px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
.empty-state .icon { color: var(--fog-400); margin: 0 auto 16px; }

.detail-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: start; }
@media (max-width: 860px) { .detail-grid { grid-template-columns: 1fr; } }
.detail-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.detail-title-block .fp-card-source { margin-bottom: 0; }
.iframe-wrap { position: relative; width: 100%; height: 70vh; min-height: 420px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); background: var(--fog-50); }
.iframe-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
.iframe-note { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 12px; margin-top: 10px; }

.stack { display: flex; flex-direction: column; gap: 16px; }
.rating-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-light, var(--fog-100)); }
.rating-row:last-child { border-bottom: none; }
.note-list { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
.note-item { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; }
.note-item .note-body { flex: 1; }
.note-item .note-meta { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
.note-item .note-del { flex: none; }
.note-section + .note-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--fog-100); }

/* login */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-card { width: 100%; max-width: 360px; }
.login-brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 24px; }
.login-brand .icon { color: var(--color-primary); }

/* modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(119, 130, 149, 0.10); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
.modal { background: var(--bg-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); border: 1px solid var(--border); padding: 24px; max-width: 420px; width: 100%; }

/* toast */
#toast-root { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 1100; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--lightning-900); color: #fff; padding: 10px 20px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 500; box-shadow: var(--shadow-card); display: flex; align-items: center; gap: 8px; }
.toast.alert { background: var(--dusk-600); }

.loading-shell { padding: 80px 24px; text-align: center; color: var(--text-muted); }
.setup-notice { max-width: 560px; margin: 80px auto; }
</style>
</head>

const CONFIGURED = !!SUPABASE_URL && !SUPABASE_URL.startsWith('YOUR_') && !!SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.startsWith('YOUR_');
const sb = CONFIGURED ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const state = {
  session: null,
  profile: null,
  profilesById: {},
  floorPlans: [],
  ratings: [],
  notes: [],
  ready: false,
  sort: 'best',
  route: parseHash(),
};

/* ---------------------------------------------------------------- utils */

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function icon(name, cls = '') {
  return `<span class="icon ${cls}">${ICONS[name] || ''}</span>`;
}

function normalizeUrl(raw) {
  let v = (raw || '').trim();
  if (!v) return null;
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
  try {
    const u = new URL(v);
    return u.href;
  } catch (e) {
    return null;
  }
}

function hostnameOf(url) {
  try {
    return new URL(url).hostname.replace(/^www\./, '');
  } catch (e) {
    return '';
  }
}

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 2592000) return Math.floor(diff / 86400) + 'd ago';
  return new Date(iso).toLocaleDateString();
}

function initials(name) {
  return (name || '?').trim().slice(0, 1).toUpperCase();
}

function parseHash() {
  const raw = (location.hash || '#/').slice(1);
  const parts = raw.split('/').filter(Boolean);
  if (parts.length === 0) return { name: 'dashboard' };
  if (parts[0] === 'floorplans' && parts[1] === 'new') return { name: 'new' };
  if (parts[0] === 'floorplans' && parts[1] && parts[2] === 'edit') return { name: 'edit', id: parts[1] };
  if (parts[0] === 'floorplans' && parts[1]) return { name: 'detail', id: parts[1] };
  return { name: 'dashboard' };
}

function navigate(hash) {
  location.hash = hash;
}

function showToast(message, tone = 'default') {
  const root = document.getElementById('toast-root');
  const t = document.createElement('div');
  t.className = 'toast' + (tone === 'alert' ? ' alert' : '');
  t.textContent = message;
  root.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ---------------------------------------------------------------- modal */

function openModal(html, { dismissible = false, onMount } = {}) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" data-backdrop><div class="modal" role="dialog">${html}</div></div>`;
  const backdrop = root.querySelector('[data-backdrop]');
  function close() { root.innerHTML = ''; }
  if (dismissible) {
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  }
  if (onMount) onMount(root, close);
  return close;
}

function promptDisplayNameModal(defaultName) {
  return new Promise((resolve) => {
    openModal(`
      <h2 class="h2" style="margin-bottom:8px">Welcome</h2>
      <p class="sm muted" style="margin-bottom:16px">What should we call you in the app?</p>
      <div class="field" id="name-field">
        <label>Your name</label>
        <input id="name-input" type="text" maxlength="30" placeholder="e.g. Wes" value="${escapeHtml(defaultName || '')}" />
      </div>
      <div style="display:flex;justify-content:flex-end">
        <button class="btn btn-primary" id="name-submit">Continue</button>
      </div>
    `, {
      dismissible: false,
      onMount: (root, close) => {
        const input = root.querySelector('#name-input');
        input.focus();
        const submit = () => {
          const v = input.value.trim();
          if (!v) { root.querySelector('#name-field').classList.add('has-error'); return; }
          close();
          resolve(v);
        };
        root.querySelector('#name-submit').addEventListener('click', submit);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
      },
    });
  });
}

function confirmModal({ title, body, confirmLabel = 'Delete', danger = true }) {
  return new Promise((resolve) => {
    openModal(`
      <h2 class="h2" style="margin-bottom:8px">${escapeHtml(title)}</h2>
      <p class="sm muted" style="margin-bottom:20px">${escapeHtml(body)}</p>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button class="btn btn-ghost" data-cancel>Cancel</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-confirm>${escapeHtml(confirmLabel)}</button>
      </div>
    `, {
      dismissible: true,
      onMount: (root, close) => {
        root.querySelector('[data-cancel]').addEventListener('click', () => { close(); resolve(false); });
        root.querySelector('[data-confirm]').addEventListener('click', () => { close(); resolve(true); });
      },
    });
  });
}

/* ---------------------------------------------------------------- data */

async function ensureProfile(user) {
  const { data: existing } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (existing) { state.profile = existing; return; }
  const { count } = await sb.from('profiles').select('*', { count: 'exact', head: true });
  const color = PALETTE[(count || 0) % PALETTE.length];
  const name = await promptDisplayNameModal(user.email.split('@')[0]);
  const { data: created, error } = await sb.from('profiles').insert({ id: user.id, display_name: name, color }).select().single();
  if (error) { showToast("Couldn't save your name — try refreshing.", 'alert'); return; }
  state.profile = created;
}

async function loadAll() {
  const [{ data: profiles }, { data: floorPlans }, { data: ratings }, { data: notes }] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('floor_plans').select('*').order('created_at', { ascending: false }),
    sb.from('floor_plan_ratings').select('*'),
    sb.from('floor_plan_notes').select('*').order('created_at', { ascending: true }),
  ]);
  state.profilesById = Object.fromEntries((profiles || []).map((p) => [p.id, p]));
  state.floorPlans = floorPlans || [];
  state.ratings = ratings || [];
  state.notes = notes || [];
  state.ready = true;
}

function ratingsFor(planId) {
  return state.ratings.filter((r) => r.floor_plan_id === planId);
}
function notesFor(planId, kind) {
  return state.notes.filter((n) => n.floor_plan_id === planId && n.kind === kind);
}
function averageFor(planId) {
  const rs = ratingsFor(planId);
  if (!rs.length) return null;
  return rs.reduce((sum, r) => sum + r.stars, 0) / rs.length;
}

async function upsertRating(planId, stars) {
  const { error } = await sb.from('floor_plan_ratings').upsert(
    { floor_plan_id: planId, user_id: state.profile.id, stars },
    { onConflict: 'floor_plan_id,user_id' }
  );
  if (error) { showToast("Couldn't save your rating — try again.", 'alert'); return; }
  await loadAll();
  render();
}

async function addNote(planId, kind, body) {
  const text = body.trim();
  if (!text) return;
  const { error } = await sb.from('floor_plan_notes').insert({ floor_plan_id: planId, user_id: state.profile.id, kind, body: text });
  if (error) { showToast("Couldn't add that note — try again.", 'alert'); return; }
  await loadAll();
  render();
}

async function deleteNote(noteId) {
  const { error } = await sb.from('floor_plan_notes').delete().eq('id', noteId);
  if (error) { showToast("Couldn't remove that note — try again.", 'alert'); return; }
  await loadAll();
  render();
}

async function createFloorPlan({ url, title, notes }) {
  const source_label = hostnameOf(url);
  const { data, error } = await sb.from('floor_plans').insert({
    url, title: title || source_label || 'Untitled floor plan', notes: notes || null,
    source_label, created_by: state.profile.id,
  }).select().single();
  if (error) { showToast("Couldn't save that floor plan — try again.", 'alert'); return null; }
  await loadAll();
  return data;
}

async function updateFloorPlan(id, { url, title, notes }) {
  const source_label = hostnameOf(url);
  const { error } = await sb.from('floor_plans').update({
    url, title: title || source_label || 'Untitled floor plan', notes: notes || null,
    source_label, updated_at: new Date().toISOString(),
  }).eq('id', id);
  if (error) { showToast("Couldn't save your changes — try again.", 'alert'); return false; }
  await loadAll();
  return true;
}

async function deleteFloorPlan(id) {
  const { error } = await sb.from('floor_plans').delete().eq('id', id);
  if (error) { showToast("Couldn't delete that floor plan — try again.", 'alert'); return false; }
  await loadAll();
  return true;
}

/* ---------------------------------------------------------------- render pieces */

function renderNavbar() {
  if (!state.session) return '';
  const p = state.profile;
  return `
    <div class="navbar">
      <a href="#/" class="navbar-brand">${icon('location')}<span>Our floor plans</span></a>
      <div class="navbar-user">
        ${p ? `<span class="avatar" style="background:${p.color}">${initials(p.display_name)}</span><span class="sm">${escapeHtml(p.display_name)}</span>` : ''}
        <button class="btn btn-ghost" id="sign-out-btn">Sign out</button>
      </div>
    </div>`;
}

function starsReadOnly(value, size = 'icon-sm') {
  let html = `<span class="stars">`;
  for (let i = 1; i <= 5; i++) {
    html += `<span class="icon ${size} ${value >= i ? 'filled' : ''}">${value >= i ? ICONS.starSolid : ICONS.star}</span>`;
  }
  return html + `</span>`;
}

function starsInput(planId, value) {
  let html = `<span class="stars interactive" data-star-input data-plan="${planId}">`;
  for (let i = 1; i <= 5; i++) {
    html += `<button type="button" class="${value >= i ? 'filled' : ''}" data-star-btn="${i}" aria-label="${i} star${i > 1 ? 's' : ''}"><span class="icon">${value >= i ? ICONS.starSolid : ICONS.star}</span></button>`;
  }
  return html + `</span>`;
}

function renderFloorPlanCard(plan) {
  const rs = ratingsFor(plan.id);
  const avg = averageFor(plan.id);
  const people = Object.values(state.profilesById);
  const likeCount = notesFor(plan.id, 'like').length;
  const dislikeCount = notesFor(plan.id, 'dislike').length;

  let badge;
  if (avg === null) badge = `<span class="badge badge-fog">Not rated yet</span>`;
  else if (avg >= 4 && rs.length === people.length) badge = `<span class="badge badge-mint">${avg.toFixed(1)}★ · you both love it</span>`;
  else badge = `<span class="badge badge-solar">${avg.toFixed(1)}★ avg</span>`;

  const rows = people.map((p) => {
    const r = rs.find((x) => x.user_id === p.id);
    return `<div class="fp-card-rating-row">
      <span class="avatar" style="background:${p.color};width:18px;height:18px;font-size:10px">${initials(p.display_name)}</span>
      <span class="name">${escapeHtml(p.display_name)}</span>
      ${r ? starsReadOnly(r.stars, 'icon-xs') : `<span class="xs">Not rated yet</span>`}
    </div>`;
  }).join('');

  return `
    <a class="fp-card" href="#/floorplans/${plan.id}">
      <div class="card-title">${escapeHtml(plan.title)}</div>
      <div class="fp-card-source">${icon('search', 'icon-xs')}${escapeHtml(plan.source_label || '')}</div>
      <div class="fp-card-ratings">${rows}</div>
      <div class="fp-card-footer">
        ${badge}
        <span class="xs">${likeCount} liked note${likeCount === 1 ? '' : 's'} · ${dislikeCount} disliked note${dislikeCount === 1 ? '' : 's'}</span>
      </div>
    </a>`;
}

function sortedFloorPlans() {
  const list = [...state.floorPlans];
  if (state.sort === 'newest') {
    list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  } else if (state.sort === 'liked') {
    list.sort((a, b) => notesFor(b.id, 'like').length - notesFor(a.id, 'like').length);
  } else {
    list.sort((a, b) => {
      const avgA = averageFor(a.id), avgB = averageFor(b.id);
      if (avgA === null && avgB === null) return new Date(b.created_at) - new Date(a.created_at);
      if (avgA === null) return 1;
      if (avgB === null) return -1;
      return avgB - avgA;
    });
  }
  return list;
}

function renderDashboard() {
  const list = sortedFloorPlans();
  const people = Object.values(state.profilesById);
  const partner = people.find((p) => p.id !== state.profile.id);
  const subtitle = state.floorPlans.length === 0
    ? `Start logging the floor plans ${escapeHtml(partner ? 'you and ' + partner.display_name : 'you two')} are considering.`
    : `You and ${escapeHtml(partner ? partner.display_name : 'your partner')} have logged ${state.floorPlans.length} floor plan${state.floorPlans.length === 1 ? '' : 's'}.`;

  const grid = list.length ? list.map(renderFloorPlanCard).join('') : `
    <div class="empty-state">
      ${icon('location', 'icon-lg')}
      <div class="h2" style="margin-bottom:8px">No floor plans yet</div>
      <p class="sm muted" style="margin-bottom:20px">Paste a link from a builder's site or listing to start comparing your favorites.</p>
      <a class="btn btn-primary" href="#/floorplans/new">${icon('add', 'icon-sm')}Add floor plan</a>
    </div>`;

  return `
    <div class="page">
      <div class="page-header">
        <div>
          <h1 class="page-title">Floor plans</h1>
          <p class="sm muted" style="margin-top:4px">${subtitle}</p>
        </div>
        <div class="page-header-actions">
          <select id="sort-select" aria-label="Sort">
            <option value="best" ${state.sort === 'best' ? 'selected' : ''}>Best match</option>
            <option value="newest" ${state.sort === 'newest' ? 'selected' : ''}>Newest first</option>
            <option value="liked" ${state.sort === 'liked' ? 'selected' : ''}>Most liked</option>
          </select>
          <a class="btn btn-primary" href="#/floorplans/new">${icon('add', 'icon-sm')}Add floor plan</a>
        </div>
      </div>
      <div class="fp-grid">${grid}</div>
    </div>`;
}

function renderFloorPlanForm({ mode, plan }) {
  const isEdit = mode === 'edit';
  return `
    <div class="page" style="max-width:560px">
      <a href="#/${isEdit ? 'floorplans/' + plan.id : ''}" class="back-link">${icon('arrowLeft', 'icon-sm')}${isEdit ? 'Back to floor plan' : 'Back to floor plans'}</a>
      <h1 class="h2" style="margin-bottom:20px">${isEdit ? 'Edit floor plan' : 'Add floor plan'}</h1>
      <form id="fp-form" class="card">
        <div class="field" id="url-field">
          <label>Link to the floor plan *</label>
          <input id="fp-url" type="text" placeholder="https://..." value="${escapeHtml(plan ? plan.url : '')}" />
          <span class="hint">Paste the public page from any floor plan or listing site.</span>
        </div>
        <div class="field">
          <label>Title</label>
          <input id="fp-title" type="text" placeholder="Auto-filled from the link if left blank" value="${escapeHtml(plan ? plan.title : '')}" />
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="fp-notes" placeholder="e.g. 3 bed, 2200 sqft, corner lot">${escapeHtml(plan ? plan.notes || '' : '')}</textarea>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <a class="btn btn-ghost" href="#/${isEdit ? 'floorplans/' + plan.id : ''}">Cancel</a>
          <button type="submit" class="btn btn-primary">${isEdit ? 'Save changes' : 'Add floor plan'}</button>
        </div>
      </form>
    </div>`;
}

function renderNotesSection(planId, kind, label) {
  const items = notesFor(planId, kind);
  const rows = items.map((n) => {
    const person = state.profilesById[n.user_id];
    const mine = n.user_id === state.profile.id;
    return `<div class="note-item">
      <span class="avatar" style="background:${person ? person.color : '#999'};width:18px;height:18px;font-size:10px;margin-top:1px">${initials(person ? person.display_name : '?')}</span>
      <div class="note-body">
        <div>${escapeHtml(n.body)}</div>
        <div class="note-meta">${escapeHtml(person ? person.display_name : 'Someone')} · ${timeAgo(n.created_at)}</div>
      </div>
      ${mine ? `<button class="btn btn-ghost btn-icon note-del" data-del-note="${n.id}" aria-label="Remove note">${icon('close', 'icon-xs')}</button>` : ''}
    </div>`;
  }).join('') || `<p class="sm muted">Nothing noted yet.</p>`;

  return `
    <div class="note-section">
      <div class="label sm" style="margin-bottom:8px">${label}</div>
      <div class="note-list">${rows}</div>
      <div class="inline-add">
        <input type="text" placeholder="${kind === 'like' ? 'What do you like about it?' : "What don't you like about it?"}" data-note-input="${kind}" data-plan="${planId}" />
        <button class="btn btn-secondary btn-icon" data-note-add="${kind}" data-plan="${planId}" aria-label="Add">${icon('add', 'icon-sm')}</button>
      </div>
    </div>`;
}

function renderDetail(plan) {
  const rs = ratingsFor(plan.id);
  const myRating = rs.find((r) => r.user_id === state.profile.id);
  const people = Object.values(state.profilesById);
  const others = people.filter((p) => p.id !== state.profile.id);
  const avg = averageFor(plan.id);

  const otherRatingRows = others.map((p) => {
    const r = rs.find((x) => x.user_id === p.id);
    return `<div class="rating-row">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="avatar" style="background:${p.color}">${initials(p.display_name)}</span>
        <span class="sm">${escapeHtml(p.display_name)}</span>
      </div>
      ${r ? starsReadOnly(r.stars) : `<span class="xs">Not rated yet</span>`}
    </div>`;
  }).join('');

  return `
    <div class="page">
      <a href="#/" class="back-link">${icon('arrowLeft', 'icon-sm')}All floor plans</a>
      <div class="detail-header">
        <div class="detail-title-block">
          <h1 class="h2">${escapeHtml(plan.title)}</h1>
          <div class="fp-card-source">${icon('search', 'icon-xs')}${escapeHtml(plan.source_label || '')}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <a class="btn btn-secondary" id="open-original" target="_blank" rel="noopener noreferrer">${icon('location', 'icon-sm')}Open original</a>
          <a class="btn btn-ghost btn-icon" href="#/floorplans/${plan.id}/edit" aria-label="Edit">${icon('edit', 'icon-sm')}</a>
          <button class="btn btn-ghost btn-icon" id="delete-plan-btn" aria-label="Delete">${icon('trash', 'icon-sm')}</button>
        </div>
      </div>

      ${plan.notes ? `<div class="card" style="margin-bottom:24px"><div class="label sm" style="margin-bottom:4px">Notes</div><p class="sm">${escapeHtml(plan.notes)}</p></div>` : ''}

      <div class="detail-grid">
        <div>
          <div class="iframe-wrap"><iframe id="fp-iframe" loading="lazy" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-popups-to-escape-sandbox" title="${escapeHtml(plan.title)}"></iframe></div>
          <div class="iframe-note">${icon('search', 'icon-xs')}Some sites block embedding — if this looks empty, use "Open original" above.</div>
        </div>
        <div class="stack">
          <div class="card">
            <div class="label sm" style="margin-bottom:10px">Your rating</div>
            ${starsInput(plan.id, myRating ? myRating.stars : 0)}
            ${otherRatingRows}
            ${avg !== null ? `<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)"><span class="badge badge-mint">${avg.toFixed(1)}★ combined average</span></div>` : ''}
          </div>
          <div class="card">
            ${renderNotesSection(plan.id, 'like', 'What you like')}
            ${renderNotesSection(plan.id, 'dislike', "What you don't like")}
          </div>
        </div>
      </div>
    </div>`;
}

function renderLogin() {
  return `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-brand">${icon('location')}<span class="h2">Our floor plans</span></div>
        <div class="card">
          <div class="field" id="login-email-field">
            <label>Email</label>
            <input id="login-email" type="email" autocomplete="username" placeholder="you@example.com" />
          </div>
          <div class="field" id="login-password-field">
            <label>Password</label>
            <input id="login-password" type="password" autocomplete="current-password" />
          </div>
          <p class="error-text" id="login-error" style="display:none;margin-bottom:12px"></p>
          <button class="btn btn-primary btn-block" id="login-submit">Sign in</button>
        </div>
      </div>
    </div>`;
}

/* ---------------------------------------------------------------- main render */

function render() {
  const app = document.getElementById('app');

  if (!CONFIGURED) {
    app.innerHTML = `<div class="page setup-notice"><div class="card">
      <h1 class="h2" style="margin-bottom:8px">Setup needed</h1>
      <p class="sm muted">Add your Supabase project URL and anon key at the top of the &lt;script&gt; block in index.html, then reload. See README.md for the full setup steps.</p>
    </div></div>`;
    return;
  }

  if (!state.session) {
    app.innerHTML = renderNavbar() + renderLogin();
    attachLoginHandlers();
    return;
  }

  if (!state.ready || !state.profile) {
    app.innerHTML = renderNavbar() + `<div class="loading-shell">Loading…</div>`;
    return;
  }

  let body = '';
  if (state.route.name === 'dashboard') body = renderDashboard();
  else if (state.route.name === 'new') body = renderFloorPlanForm({ mode: 'new' });
  else if (state.route.name === 'detail') {
    const plan = state.floorPlans.find((p) => p.id === state.route.id);
    body = plan ? renderDetail(plan) : `<div class="page"><div class="empty-state">${icon('location', 'icon-lg')}<div class="h2">Floor plan not found</div><p class="sm muted" style="margin:8px 0 20px">It may have been removed.</p><a class="btn btn-primary" href="#/">Back to floor plans</a></div></div>`;
  } else if (state.route.name === 'edit') {
    const plan = state.floorPlans.find((p) => p.id === state.route.id);
    body = plan ? renderFloorPlanForm({ mode: 'edit', plan }) : `<div class="page"><div class="empty-state">${icon('location', 'icon-lg')}<div class="h2">Floor plan not found</div><a class="btn btn-primary" style="margin-top:16px" href="#/">Back to floor plans</a></div></div>`;
  }

  app.innerHTML = renderNavbar() + body;
  attachHandlers();

  if (state.route.name === 'detail') {
    const plan = state.floorPlans.find((p) => p.id === state.route.id);
    if (plan) {
      const iframeEl = document.getElementById('fp-iframe');
      const openLink = document.getElementById('open-original');
      if (iframeEl) iframeEl.src = plan.url;
      if (openLink) openLink.href = plan.url;
    }
  }
}

/* ---------------------------------------------------------------- event wiring */

function attachLoginHandlers() {
  const submit = async () => {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';
    document.getElementById('login-email-field').classList.remove('has-error');
    document.getElementById('login-password-field').classList.remove('has-error');
    if (!email || !password) {
      if (!email) document.getElementById('login-email-field').classList.add('has-error');
      if (!password) document.getElementById('login-password-field').classList.add('has-error');
      return;
    }
    const btn = document.getElementById('login-submit');
    btn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    if (error) {
      errEl.textContent = "Couldn't sign in — check your email and password.";
      errEl.style.display = 'block';
    }
  };
  document.getElementById('login-submit').addEventListener('click', submit);
  document.getElementById('login-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
}

function attachHandlers() {
  const signOutBtn = document.getElementById('sign-out-btn');
  if (signOutBtn) signOutBtn.addEventListener('click', () => sb.auth.signOut());

  const sortSelect = document.getElementById('sort-select');
  if (sortSelect) sortSelect.addEventListener('change', (e) => { state.sort = e.target.value; render(); });

  document.querySelectorAll('[data-star-input]').forEach((wrap) => {
    const planId = wrap.dataset.plan;
    wrap.querySelectorAll('[data-star-btn]').forEach((btn) => {
      btn.addEventListener('click', () => upsertRating(planId, parseInt(btn.dataset.starBtn, 10)));
    });
  });

  document.querySelectorAll('[data-note-add]').forEach((btn) => {
    const kind = btn.dataset.noteAdd, planId = btn.dataset.plan;
    const input = document.querySelector(`[data-note-input="${kind}"][data-plan="${planId}"]`);
    const submit = () => { addNote(planId, kind, input.value); input.value = ''; };
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  });

  document.querySelectorAll('[data-del-note]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const ok = await confirmModal({ title: 'Remove this note?', body: 'This note will be deleted for both of you.', confirmLabel: 'Remove' });
      if (ok) deleteNote(btn.dataset.delNote);
    });
  });

  const deletePlanBtn = document.getElementById('delete-plan-btn');
  if (deletePlanBtn) {
    deletePlanBtn.addEventListener('click', async () => {
      const plan = state.floorPlans.find((p) => p.id === state.route.id);
      const ok = await confirmModal({ title: 'Delete this floor plan?', body: `"${plan.title}" and all its ratings and notes will be removed for both of you. This can't be undone.` });
      if (ok) { const done = await deleteFloorPlan(plan.id); if (done) { showToast('Floor plan deleted'); navigate('/'); } }
    });
  }

  const fpForm = document.getElementById('fp-form');
  if (fpForm) {
    fpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawUrl = document.getElementById('fp-url').value;
      const title = document.getElementById('fp-title').value.trim();
      const notes = document.getElementById('fp-notes').value.trim();
      const url = normalizeUrl(rawUrl);
      const urlField = document.getElementById('url-field');
      urlField.classList.remove('has-error');
      const existingErr = urlField.querySelector('.error-text');
      if (existingErr) existingErr.remove();
      if (!url) {
        urlField.classList.add('has-error');
        urlField.insertAdjacentHTML('beforeend', `<span class="error-text">Enter a valid link, starting with https://</span>`);
        return;
      }
      const submitBtn = fpForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      if (state.route.name === 'edit') {
        const ok = await updateFloorPlan(state.route.id, { url, title, notes });
        submitBtn.disabled = false;
        if (ok) { showToast('Changes saved'); navigate(`/floorplans/${state.route.id}`); }
      } else {
        const created = await createFloorPlan({ url, title, notes });
        submitBtn.disabled = false;
        if (created) { showToast('Floor plan added'); navigate(`/floorplans/${created.id}`); }
      }
    });
  }
}

/* ---------------------------------------------------------------- realtime */

let realtimeChannel = null;
const debouncedReload = debounce(async () => { await loadAll(); render(); }, 300);

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function subscribeRealtime() {
  if (realtimeChannel) return;
  realtimeChannel = sb.channel('floor-plan-evaluator')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'floor_plans' }, debouncedReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'floor_plan_ratings' }, debouncedReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'floor_plan_notes' }, debouncedReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, debouncedReload)
    .subscribe();
}

/* ---------------------------------------------------------------- boot */

window.addEventListener('hashchange', () => { state.route = parseHash(); render(); });

if (!CONFIGURED) {
  render();
} else {
  sb.auth.onAuthStateChange(async (event, session) => {
    state.session = session;
    if (session) {
      render();
      await ensureProfile(session.user);
      await loadAll();
      subscribeRealtime();
      render();
    } else {
      state.ready = false;
      state.profile = null;
      render();
    }
  });
  render();
}
</script>
